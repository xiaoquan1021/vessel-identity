[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vessel-identity"
version = "0.1.0"
description = "Entity identity and invalidation semantics for multi-fidelity vascular models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["vascular", "provenance", "reproducibility", "identity", "hemodynamics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/xiaoquan1021/vessel-identity"
Issues = "https://github.com/xiaoquan1021/vessel-identity/issues"

[tool.hatch.build.targets.wheel]
packages = ["vessel_identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
