name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check standard-library-only runtime dependency
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          allowed = {
              "__future__", "dataclasses", "enum", "math", "typing", "uuid",
              "json", "pathlib", "collections", "itertools", "functools",
              "vessel_identity",
          }
          bad = []
          for p in pathlib.Path("vessel_identity").rglob("*.py"):
              tree = ast.parse(p.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          root = a.name.split(".")[0]
                          if root not in allowed:
                              bad.append(f"{p}: import {a.name}")
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      root = node.module.split(".")[0]
                      if root not in allowed:
                          bad.append(f"{p}: from {node.module}")
          if bad:
              print("运行时引入了第三方依赖（本库只允许标准库）：")
              print("\n".join(bad))
              sys.exit(1)
          print("OK: 仅标准库")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m compileall -q vessel_identity
